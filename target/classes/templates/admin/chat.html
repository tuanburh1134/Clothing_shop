<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kênh chat</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="with-background">
<div class="admin-layout">
    <aside class="sidebar">
        <div>
            <h2>Quản lí</h2>
            <p class="sidebar-subtitle">Tài khoản admin</p>
        </div>

        <nav class="sidebar-menu">
            <a href="/admin/dashboard">Tổng quan</a>
            <a href="/admin/inventory">Quản lí kho</a>
            <a href="/admin/orders">Quản lí đơn hàng</a>
            <a href="/admin/notifications">Thông báo</a>
            <a href="/admin/chat" class="active">Kênh chat</a>
            <a href="/products">Chuyển sang trang khách hàng</a>
        </nav>

        <form th:action="@{/logout}" method="post" class="logout-form">
            <button type="submit">Đăng xuất</button>
        </form>
    </aside>

    <main class="dashboard-content">
        <section class="hero-card">
            <div>
                <p class="eyebrow">Kênh chat</p>
                <h1>Kênh chat khách hàng</h1>
                <p>Theo dõi và phản hồi tin nhắn khách hàng theo thời gian thực.</p>
            </div>
        </section>

        <section class="dashboard-section">
            <div class="info-card admin-chat-layout">
                <aside class="admin-chat-conversations">
                    <h3>Hội thoại</h3>
                    <div id="adminConversationList" class="admin-chat-conversation-list"></div>
                </aside>

                <section class="admin-chat-thread">
                    <header class="admin-chat-thread-head">
                        <h3 id="adminThreadTitle">Chọn hội thoại để trả lời</h3>
                    </header>

                    <div id="adminThreadMessages" class="admin-chat-thread-messages"></div>

                    <form id="adminChatForm" class="admin-chat-form">
                        <input id="adminChatInput" type="text" maxlength="1000" placeholder="Nhập nội dung phản hồi..." autocomplete="off" disabled>
                        <button type="submit" disabled id="adminChatSendBtn">Gửi</button>
                    </form>
                </section>
            </div>
        </section>
    </main>
</div>
<script src="/js/admin-chat.js"></script>
</body>
</html>
